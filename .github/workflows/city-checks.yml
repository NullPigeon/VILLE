name: City checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    name: City checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: landville_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Record checks on the exact head commit, not the synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:modules
      - run: npm run lint
      - run: npm test
      - name: Real PostgreSQL lifecycle and concurrent claims
        run: node scripts/test-build-database.mjs
        env:
          LANDVILLE_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/landville_test
      - run: npm run build
